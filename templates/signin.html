<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background: url('{{ url_for('static', filename='inp2.png') }}') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(3px);
        }

        /* Glass Box */
        .container {
            position: relative;
            z-index: 1;
            width: 380px;
            padding: 40px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.45);
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
            color: #00ff9d;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0,255,150,0.6);
        }

        /* Inputs */
        .input-box {
            width: 100%;
            margin: 12px 0;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.9);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            box-shadow: 0 0 10px rgba(0,255,150,0.6);
        }

        /* Glide Button */
        input[type="submit"] {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            background: linear-gradient(135deg, #00e676, #1de9b6);
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            color: #003300;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(0,255,150,0.4);
        }

        input[type="submit"]:hover {
            transform: scale(1.07);
            background: linear-gradient(135deg, #19ff85, #48ffd1);
            box-shadow: 0 6px 18px rgba(0,255,150,0.6);
        }

        a {
            display: block;
            margin-top: 20px;
            color: #00ffb3;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        a:hover {
            color: #7affd9;
            text-shadow: 0 0 8px rgba(0,255,150,0.7);
        }
    </style>
</head>

<body>
    <div class="overlay"></div>

    <div class="container">
        <h1>Sign In</h1>

        <form method="post">
            <div class="input-box">
                <input type="text" name="username" placeholder="Enter Username" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <input type="submit" value="Sign In">
        </form>

        <a href="/signup">Don't have an account? Create one</a>
    </div>

</body>
</html>
